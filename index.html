<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEEAF8;--surface:#fff;--ink:#1E1A3A;--muted:#6A6590;--line:#d9d3ee;--back1:#2A2368;--back2:#4637a8;--gold:#FFC857;--shadow:0 20px 50px -18px rgba(42,35,104,.45);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2A1F78;--surface:#3A2E9C;--ink:#F6F3FF;--muted:#C4BDF5;--line:#5646C4;--back1:#17104A;--back2:#4B3BC4;--shadow:0 20px 50px -18px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2A1F78;--surface:#3A2E9C;--ink:#F6F3FF;--muted:#C4BDF5;--line:#5646C4;--back1:#17104A;--back2:#4B3BC4;--shadow:0 20px 50px -18px rgba(0,0,0,.7);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;transition:background .4s,color .4s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 15% 0,rgba(123,108,246,.22),transparent 70%),radial-gradient(500px 400px at 100% 100%,rgba(242,107,181,.16),transparent 70%);pointer-events:none;z-index:0}
header,main,footer{position:relative;z-index:1;width:100%;max-width:520px;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding-top:18px;gap:10px}
h1{margin:0;font-size:1.45rem;font-weight:800;letter-spacing:-.02em;line-height:1}
.sub{margin:4px 0 0;color:var(--muted);font-size:.85rem;font-weight:500}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;font-size:.78rem;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--back2);color:#fff}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.05rem;cursor:pointer;display:grid;place-items:center}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
main{display:flex;flex-direction:column;align-items:center;flex:1;padding-top:26px}
.stage{position:relative;width:min(76vw,310px);aspect-ratio:2/3;perspective:1100px;margin-bottom:22px}
.layer{position:absolute;inset:0;border-radius:24px;background:linear-gradient(145deg,var(--back1),var(--back2));border:2px solid rgba(255,200,87,.35);box-shadow:var(--shadow)}
.l1{transform:translate(9px,9px) rotate(3deg);opacity:.75}.l2{transform:translate(-8px,6px) rotate(-3.5deg);opacity:.5}
.tilt{position:absolute;inset:0;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out;transform-style:preserve-3d}
.card{position:absolute;inset:0;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1);font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:var(--shadow)}
.back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px),repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px),linear-gradient(145deg,var(--back1),var(--back2));border:2px solid var(--gold);display:grid;place-items:center}
.back::before{content:"";position:absolute;inset:14px;border:1.5px solid rgba(255,200,87,.6);border-radius:16px}
.emblem{width:46%;aspect-ratio:1;border-radius:50%;background:var(--gold);color:var(--back1);display:grid;place-items:center;font-size:clamp(3rem,16vw,4.6rem);font-weight:800;box-shadow:0 0 0 10px rgba(255,200,87,.2);animation:pulse 2.6s ease-in-out infinite}
.card.flipped .emblem{animation:none}
@keyframes pulse{50%{transform:scale(1.07)}}
.tap{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:var(--gold);font-weight:700;font-size:.9rem}
.front{background:var(--surface);transform:rotateY(180deg);display:flex;flex-direction:column;text-align:left;border:1px solid var(--line)}
.band{background:var(--c,#7B6CF6);color:#fff;padding:14px 20px;font-weight:800;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.band span:last-child{font-size:1.4rem}
.q{flex:1;display:flex;align-items:center;padding:20px 22px;font-size:clamp(1.3rem,6.2vw,1.75rem);font-weight:700;line-height:1.22;letter-spacing:-.015em}
.pip{padding:0 22px 16px;color:var(--c);font-size:1.5rem;align-self:flex-end;transform:rotate(180deg)}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.go{border:0;border-radius:999px;background:var(--gold);color:#2A2368;font:inherit;font-weight:800;font-size:1.05rem;padding:14px 34px;cursor:pointer;box-shadow:0 10px 24px -10px rgba(255,200,87,.9);transition:transform .15s}
.go:active{transform:scale(.95)}
.hint{color:var(--muted);font-size:.8rem;margin:0}
.count{font-weight:700;font-size:.9rem;color:var(--muted)}.count b{display:inline-block;color:var(--ink);font-size:1.15rem}
.count b.bump{animation:bump .4s}@keyframes bump{40%{transform:scale(1.5)}}
.recent{width:100%;margin-top:22px;padding-bottom:28px}
.recent h2{font-size:.85rem;color:var(--muted);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-size:.85rem;font-weight:500;color:var(--ink);cursor:pointer}
.chip i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}

.exit{display:none}
body.full .exit{display:block;position:fixed;top:calc(env(safe-area-inset-top,0px) + 18px);left:20px;z-index:3;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.85rem;padding:9px 14px;border-radius:999px;cursor:pointer}
body.full{overflow:hidden}

body.full .layer,body.full .recent,body.full .hint{display:none}
body.full .tilt{transform:none!important}
body.full .face{border-radius:0;box-shadow:none}

body.full .pip{padding:0 28px 175px;font-size:2rem}

body.full .count{background:var(--surface);padding:4px 14px;border-radius:999px;margin:0;border:1px solid var(--line)}
.skip{background:none;border:1.5px dashed var(--muted);color:var(--ink);font:inherit;font-weight:700;font-size:.9rem;padding:9px 20px;border-radius:999px;cursor:pointer}

.q ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;font-size:.75em;width:100%}
.q li{display:flex;gap:10px;align-items:flex-start;line-height:1.22}
.q li b{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:.8em}
.tut{position:fixed;inset:0;z-index:50;background:rgba(10,8,30,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}

.tskip{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;padding:6px 8px}
.tico{font-size:3rem;line-height:1;margin-bottom:12px}
.tbox h2{margin:0 0 8px;font-size:1.4rem;font-weight:800;letter-spacing:-.02em}

    st.deck=d}
  return st.deck.pop()}
function flip(on){st.flipped=on;updSkip();$("card").classList.toggle("flipped",on);$("go").textContent=on?t("next"):t("draw")}
function show(i,fresh){
  if(st.busy)return;st.busy=true;
  var go=function(){
    st.mode="q";st.cur=i;paintCard();flip(true);
    if(fresh){st.count++;var n=$("n");n.textContent=st.count;n.classList.remove("bump");void n.offsetWidth;n.classList.add("bump");
      st.hist.unshift(i);if(st.hist.length>5)st.hist.pop();paintHist()}
    setTimeout(function(){st.busy=false},650)};
  if(st.flipped){flip(false);setTimeout(go,420)}else go()}
function draw(){show(pick(),true)}
$("card").onclick=draw;$("go").onclick=draw;$("skip").onclick=skip;$("tskip").onclick=tutClose;$("help").onclick=tutOpen;
$("tback").onclick=function(){if(ts>0){ts--;tutRender()}};
$("tnext").onclick=function(){if(ts<T.length-1){ts++;tutRender()}else tutClose()};
document.addEventListener("keydown",function(e){if(e.code==="Space"&&e.target===document.body&&$("tut").hidden){e.preventDefault();draw()}});
$("en").onclick=function(){st.lang="en";sv("lc-lang","en");paintText()};
$("tl").onclick=function(){st.lang="tl";sv("lc-lang","tl");paintText()};
$("theme").onclick=function(){applyTheme(st.theme==="dark"?"light":"dark")};
$("stage").addEventListener("pointermove",function(e){
  if(e.pointerType==="touch")return;
  var r=this.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  $("tilt").style.setProperty("--ry",(x*14)+"deg");$("tilt").style.setProperty("--rx",(-y*14)+"deg")});
$("stage").addEventListener("pointerleave",function(){$("tilt").style.setProperty("--ry","0deg");$("tilt").style.setProperty("--rx","0deg")});
function setFull(on){document.body.classList.toggle("full",on);var b=$("full");b.setAttribute("aria-pressed",on);b.textContent=on?"\u2921":"\u2922";sv("lc-full",on?"1":"0")}
$("full").onclick=function(){setFull(!document.body.classList.contains("full"))};
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if(!$("tut").hidden)tutClose();else setFull(false)}});
$("exit").onclick=function(){setFull(false)};
var sl=ld("lc-lang");st.lang=sl==="tl"?"tl":"en";
applyTheme(ld("lc-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
paintText();setFull(ld("lc-full")==="1");if(ld("lc-tut")!=="1")tutOpen();
